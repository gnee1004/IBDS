<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IBDS 설정</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="mark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="name">IBDS</div>
        </div>

        <a href="/" class="nav-item active">
            <span class="nav-tile">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
            </span>
            스캔 설정
        </a>
        <a href="/run" class="nav-item">
            <span class="nav-tile">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"></path></svg>
            </span>
            스캔 실행
        </a>
        <a href="/scan" class="nav-item">
            <span class="nav-tile">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h6M4 15h10M4 11h16M4 7h16"></path></svg>
            </span>
            리포트
        </a>

        <div class="sidebar-box">
            <div class="label">최근 스캔</div>
            <div class="value" id="recentSummary">불러오는 중…</div>
        </div>
    </div>

    <div class="main narrow">
        <div style="margin-bottom:30px">
            <div class="page-title">스캔 설정</div>
            <div class="page-sub">스캔을 돌리기 전에 필요한 값을 등록합니다</div>
        </div>

        <div class="card card-row" style="margin-bottom:14px">
            <div class="icon-tile" style="background:linear-gradient(160deg, var(--accent), #5AA9E6)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path></svg>
            </div>
            <div class="body">
                <div class="card-title">타겟 URL</div>
                <div class="card-desc">스캔할 대상 서버의 기본 주소</div>
                <input class="input" id="target_url" placeholder="http://192.168.55.201:8080">
            </div>
        </div>

        <div class="advanced" style="margin-bottom:20px">
            <button class="advanced-toggle" id="advToggle" onclick="toggleAdvanced()">
                <span>고급 설정 (선택)</span>
                <svg class="chevron" id="advChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="advanced-body" id="advancedBody">
                <div class="card card-row">
                    <div class="icon-tile" style="background:linear-gradient(160deg, #FF9500, #FFB340)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8l4 4-4 4M7 8l-4 4 4 4M14 4l-4 16"></path></svg>
                    </div>
                    <div class="body">
                        <div class="card-title">재방문 주소</div>
                        <div class="card-desc">자동 추정이 틀릴 때만 직접 지정합니다 — 폼이 보내는 주소(A) → 저장된 글이 실제로 보이는 주소(B)</div>

                        <div id="override-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px"></div>

                        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
                            <input class="input" id="override_a" placeholder="A url · .../guestbook/add.php" style="flex:1">
                            <input class="input" id="override_b" placeholder="B url · .../guestbook/list.php" style="flex:1">
                            <button class="btn-ghost" style="flex-shrink:0" onclick="addOverride()">추가</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:16px">
            <button class="btn-primary" onclick="saveConfig()">설정 저장</button>
            <div id="status" class="status-msg"></div>
        </div>
    </div>
</div>

<script>
let overrides = {};

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
}

async function loadConfig() {
    const res = await fetch("/api/config");
    const cfg = await res.json();
    document.getElementById("target_url").value = cfg.target_url || "";
    overrides = cfg.revisit_urls || {};
    renderOverrides();
    if (Object.keys(overrides).length) openAdvanced();  // 이미 등록된 게 있으면 접어두지 않고 바로 보여줌
}

function openAdvanced() {
    document.getElementById("advToggle").classList.add("open");
    document.getElementById("advancedBody").classList.add("open");
}

function toggleAdvanced() {
    document.getElementById("advToggle").classList.toggle("open");
    document.getElementById("advancedBody").classList.toggle("open");
}

function renderOverrides() {
    const list = document.getElementById("override-list");
    list.innerHTML = "";
    for (const [a, b] of Object.entries(overrides)) {
        const row = document.createElement("div");
        row.className = "override-row";
        row.innerHTML = `
            <button class="remove-btn"><svg width="10" height="2" viewBox="0 0 10 2" fill="white"><rect width="10" height="2" rx="1"></rect></svg></button>
            <span class="mono override-url">${escapeHtml(a)}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0A5" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span class="mono override-url">${escapeHtml(b)}</span>
        `;
        row.querySelector("button").onclick = () => { delete overrides[a]; renderOverrides(); };
        list.appendChild(row);
    }
}

function addOverride() {
    const a = document.getElementById("override_a").value.trim();
    const b = document.getElementById("override_b").value.trim();
    if (!a || !b) return;
    overrides[a] = b;
    document.getElementById("override_a").value = "";
    document.getElementById("override_b").value = "";
    renderOverrides();
}

async function saveConfig() {
    const target_url = document.getElementById("target_url").value.trim();
    const statusEl = document.getElementById("status");
    try {
        const res = await fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_url, revisit_urls: overrides }),
        });
        if (!res.ok) throw new Error(await res.text());
        statusEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#34C759"><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l2.6 2.6L16.5 9" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg> 저장했습니다';
        statusEl.className = "status-msg ok";
    } catch (e) {
        statusEl.textContent = "저장 실패: " + e.message;
        statusEl.className = "status-msg err";
    }
}

async function loadRecentSummary() {
    const el = document.getElementById("recentSummary");
    try {
        const res = await fetch("/api/results");
        const data = await res.json();
        const total = (data.groups || []).reduce((n, g) => n + g.items.length, 0);
        el.textContent = total ? `판정 ${total}건 기록됨` : "아직 스캔 결과 없음";
    } catch (e) {
        el.textContent = "불러오기 실패";
    }
}

loadConfig();
loadRecentSummary();
</script>
</body>
</html>
